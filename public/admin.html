<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hôtel des Pins — Caisse & Statistiques</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid var(--border); margin-bottom: 24px; }
    h1 { font-size: 1.4rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }

    /* KPI Cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
    .kpi-title { font-size: 0.8rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }
    .kpi-value { font-size: 1.8rem; font-weight: 800; color: var(--accent); }

    /* Tableau des Commandes */
    .table-section { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; }
    .table-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .table-title { font-size: 1.1rem; font-weight: 700; }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #111827; padding: 12px 18px; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
    td { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }

    .badge-stat { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; display: inline-block; }
    .badge-en_attente { background: #eab308; color: #000; }
    .badge-en_cours { background: #f97316; color: #fff; }
    .badge-pret { background: #38bdf8; color: #000; }
    .badge-servi { background: #22c55e; color: #fff; }

    .btn-action { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }
    .btn-action:hover { background: #475569; }
  </style>
</head>
<body>

  <header>
    <h1>📊 Tableau de bord Caisse — Hôtel des Pins</h1>
    <button class="btn-action" onclick="chargerDonnees()">🔄 Actualiser</button>
  </header>

  <!-- CARTES KPI -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title">Chiffre d'Affaires Total</div>
      <div class="kpi-value" id="kpi-ca">0,00 €</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Total Commandes</div>
      <div class="kpi-value" id="kpi-count">0</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title">Panier Moyen / Table</div>
      <div class="kpi-value" id="kpi-panier">0,00 €</div>
    </div>
  </div>

  <!-- TABLEAU HISTORIQUE -->
  <div class="table-section">
    <div class="table-header">
      <div class="table-title">Historique des Commandes du Service</div>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Table</th>
          <th>Heure</th>
          <th>Détail Articles</th>
          <th>Total</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody id="orders-table-body">
        <tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Chargement...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    async function chargerDonnees() {
      try {
        const res = await fetch('/api/admin/commandes');
        if (!res.ok) return;
        const data = await res.json();

        let totalCA = 0;
        const tbody = document.getElementById('orders-table-body');
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">Aucune commande enregistrée</td></tr>';
          document.getElementById('kpi-ca').innerText = '0,00 €';
          document.getElementById('kpi-count').innerText = '0';
          document.getElementById('kpi-panier').innerText = '0,00 €';
          return;
        }

        data.forEach(cmd => {
          let totalCmd = 0;
          let itemsText = [];

          if (cmd.items && Array.isArray(cmd.items)) {
            cmd.items.forEach(it => {
              totalCmd += (it.prix * it.quantite);
              itemsText.push(`${it.quantite}x ${it.article_nom}`);
            });
          }

          totalCA += totalCmd;
          const heure = cmd.date_creation ? new Date(cmd.date_creation).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>#${cmd.id}</td>
            <td><strong>Table ${cmd.table_num}</strong></td>
            <td>${heure}</td>
            <td>${itemsText.join(', ')}</td>
            <td><strong>${totalCmd.toFixed(2)} €</strong></td>
            <td><span class="badge-stat badge-${cmd.statut || 'en_attente'}">${cmd.statut || 'En attente'}</span></td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('kpi-ca').innerText = `${totalCA.toFixed(2)} €`;
        document.getElementById('kpi-count').innerText = `${data.length}`;
        const panierMoyen = data.length > 0 ? (totalCA / data.length) : 0;
        document.getElementById('kpi-panier').innerText = `${panierMoyen.toFixed(2)} €`;

      } catch (e) {
        console.error(e);
      }
    }

    chargerDonnees();
    setInterval(chargerDonnees, 10000);
  </script>
</body>
</html>
