<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hôtel des Pins — Administration & Ventes</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #1e293b;
      --accent: #2563eb;
      --success: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 30px; }
    .container { max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    h1 { font-size: 1.6rem; font-weight: 800; color: var(--primary); }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .kpi-title { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; margin-bottom: 8px; }
    .kpi-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
    .kpi-value.green { color: var(--success); }
    .kpi-value.blue { color: var(--accent); }

    .section-title { font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; color: var(--primary); }
    .table-container { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f1f5f9; padding: 14px 18px; font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 14px 18px; font-size: 0.9rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #f8fafc; }

    .badge-stat { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .stat-en_attente { background: #fef9c3; color: #854d0e; }
    .stat-en_cours, .stat-en_preparation { background: #ffedd5; color: #9a3412; }
    .stat-pret { background: #dcfce7; color: #166534; }
    .stat-servi { background: #e0f2fe; color: #0369a1; }
    .stat-encaisse { background: #e2e8f0; color: #334155; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Hôtel des Pins — Administration & Ventes</h1>
    </header>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-title">Chiffre d'Affaires Encaissé</div>
        <div class="kpi-value green" id="kpi-ca">0,00 €</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Commandes Actives</div>
        <div class="kpi-value" id="kpi-actives">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Tables Encaissées</div>
        <div class="kpi-value blue" id="kpi-encaissees">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Temps Moyen Service</div>
        <div class="kpi-value" id="kpi-temps-moyen">0 min</div>
      </div>
    </div>

    <h2 class="section-title">Historique des commandes & Encaissements</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Table</th>
            <th>Heure</th>
            <th>Statut</th>
            <th>Paiement</th>
            <th>Montant</th>
            <th>Détail du ticket</th>
          </tr>
        </thead>
        <tbody id="orders-table-body">
          <tr><td colspan="6" style="text-align: center; padding: 30px;">Chargement...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const socket = typeof io !== 'undefined' ? io() : null;

    async function chargerDonneesAdmin() {
      try {
        const res = await fetch('/api/admin/commandes');
        if (res.ok) {
          const commandes = await res.json();
          calculerKPIsEtAfficher(commandes);
        }
      } catch (err) {}
    }

    function calculerKPIsEtAfficher(commandes) {
      const actives = commandes.filter(c => c.statut !== 'encaisse' && c.statut !== 'annule');
      const encaissees = commandes.filter(c => c.statut === 'encaisse');
      
      let totalCA = 0;
      encaissees.forEach(c => {
        if (c.items && Array.isArray(c.items)) {
          c.items.forEach(it => totalCA += (it.prix || 0) * (it.quantite || 1));
        }
      });

      document.getElementById('kpi-ca').innerText = `${totalCA.toFixed(2)} €`;
      document.getElementById('kpi-actives').innerText = actives.length;
      document.getElementById('kpi-encaissees').innerText = encaissees.length;

      // Temps moyen
      let durees = 0;
      let countValides = 0;
      encaissees.forEach(c => {
        if (c.date_creation && c.date_fin) {
          const diff = Math.round((new Date(c.date_fin) - new Date(c.date_creation)) / 60000);
          if (diff >= 0) { durees += diff; countValides++; }
        }
      });
      document.getElementById('kpi-temps-moyen').innerText = countValides > 0 ? `${Math.round(durees / countValides)} min` : '0 min';

      // Rendu tableau
      const tbody = document.getElementById('orders-table-body');
      if (commandes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px;">Aucune commande</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      commandes.forEach(c => {
        const tr = document.createElement('tr');
        const heure = c.date_creation ? new Date(c.date_creation).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '-';
        
        let montant = 0;
        let detailsHtml = '';
        if (c.items && Array.isArray(c.items)) {
          detailsHtml = c.items.map(it => {
            montant += (it.prix || 0) * (it.quantite || 1);
            return `<div><strong>${it.quantite || 1}x</strong> ${it.article_nom}</div>`;
          }).join('');
        }

        tr.innerHTML = `
          <td><strong>Table ${c.table_num}</strong></td>
          <td>${heure}</td>
          <td><span class="badge-stat stat-${c.statut}">${getLibelleStatut(c.statut)}</span></td>
          <td>${c.mode_paiement ? `<strong>${c.mode_paiement}</strong>` : '-'}</td>
          <td><strong>${montant > 0 ? montant.toFixed(2) + ' €' : '-'}</strong></td>
          <td><div style="font-size:0.82rem; color:#475569;">${detailsHtml}</div></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function getLibelleStatut(st) {
      if (st === 'en_cours' || st === 'en_preparation') return 'En Prépa';
      if (st === 'pret') return 'Prêt';
      if (st === 'servi') return 'Servi';
      if (st === 'encaisse') return 'Encaissé';
      return 'En Attente';
    }

    if (socket) {
      socket.on('nouvelle_commande', () => chargerDonneesAdmin());
      socket.on('statut_mis_a_jour', () => chargerDonneesAdmin());
      socket.on('table_status_change', () => chargerDonneesAdmin());
    }

    setInterval(chargerDonneesAdmin, 5000);
    chargerDonneesAdmin();
  </script>
</body>
</html>
