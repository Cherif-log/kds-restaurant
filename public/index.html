<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hôtel des Pins — Prise de commande</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --success: #16a34a;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* Bannière Notification Prêt */
    #notif-ready-bar { display: none; background: #16a34a; color: #fff; text-align: center; padding: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }

    header { background: var(--primary); color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    .header-links { display: flex; gap: 10px; align-items: center; }
    .btn-nav-top { background: #334155; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }

    .app-layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 54px); }
    .main-content { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .ticket-sidebar { width: 380px; background: #fff; border-left: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; box-shadow: -4px 0 15px rgba(0,0,0,0.03); }

    .section-label { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; }
    .tables-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px; scrollbar-width: none; }
    .tables-scroll::-webkit-scrollbar { display: none; }
    .btn-table { flex: 0 0 62px; height: 42px; background: #fff; border: 1.5px solid var(--border); border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; color: var(--text); }
    .btn-table.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 10px rgba(37,99,235,0.25); }

    .cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .btn-cat-tab { white-space: nowrap; padding: 8px 16px; background: #e2e8f0; border: none; border-radius: 20px; font-weight: 700; font-size: 0.85rem; cursor: pointer; color: #475569; }
    .btn-cat-tab.active { background: var(--primary); color: #fff; }

    .section-header { font-size: 0.95rem; font-weight: 800; color: var(--primary); margin: 16px 0 10px 0; padding-bottom: 4px; border-bottom: 2px solid #e2e8f0; }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-bottom: 15px; }
    
    .dish-card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s; }
    .dish-card.active { border-color: var(--accent); background: var(--accent-light); }
    .dish-info { flex: 1; padding-right: 10px; }
    .dish-name { font-weight: 600; font-size: 0.88rem; line-height: 1.3; color: var(--text); }
    .dish-price { font-weight: 700; font-size: 0.85rem; color: var(--accent); margin-top: 3px; }

    .qty-controls { display: flex; align-items: center; gap: 6px; background: #f1f5f9; padding: 3px; border-radius: 8px; border: 1px solid var(--border); }
    .dish-card.active .qty-controls { background: #fff; border-color: var(--accent); }
    .btn-q { width: 30px; height: 30px; border: none; background: #fff; border-radius: 6px; font-weight: 800; font-size: 1.1rem; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; }
    .dish-card.active .btn-q.plus { background: var(--accent); color: #fff; }
    .q-val { font-weight: 800; font-size: 0.95rem; min-width: 22px; text-align: center; color: var(--text); }

    .ticket-header { padding: 14px 18px; background: var(--primary); color: #fff; font-size: 1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .ticket-body { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
    .ticket-empty { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 40px; }
    
    .ticket-row { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
    .ticket-row-info { flex: 1; padding-right: 8px; }
    .ticket-row-title { font-weight: 700; font-size: 0.88rem; color: var(--text); }
    .ticket-row-cat { font-size: 0.75rem; color: var(--text-muted); }
    .ticket-row-price { font-weight: 700; font-size: 0.9rem; color: var(--accent); margin-right: 8px; }

    .ticket-footer { padding: 14px 18px; border-top: 1px solid var(--border); background: #fff; }
    .ticket-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; }
    .ticket-note { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.85rem; margin-bottom: 10px; outline: none; }
    .btn-send { width: 100%; background: var(--success); color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .btn-send:disabled { background: #94a3b8; cursor: not-allowed; }

    @media (max-width: 900px) {
      .app-layout { flex-direction: column; height: auto; }
      .ticket-sidebar { width: 100%; border-left: none; border-top: 2px solid var(--border); height: auto; }
    }
  </style>
</head>
<body>

    function init() {
      const tContainer = document.getElementById('tables-container');
      tContainer.innerHTML = '';
      for (let i = 1; i <= 15; i++) {
        const btn = document.createElement('button');
        btn.className = `btn-table ${i === currentTable ? 'active' : ''}`;
        btn.innerText = `T${i}`;
        btn.onclick = () => {
          document.querySelectorAll('.btn-table').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTable = i;
          document.getElementById('current-table-title').innerText = i;
        };
        tContainer.appendChild(btn);
      }

      const categories = ["Menu 40 €", "Entrées (15 €)", "Poissons (25 €)", "Viandes (25 €)", "Desserts", "Menu Enfant (15 €)", "Glaces"];
      const catContainer = document.getElementById('cat-tabs-container');
      catContainer.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `btn-cat-tab ${cat === currentTab ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
          document.querySelectorAll('.btn-cat-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTab = cat;
          afficherPlats();
        };
        catContainer.appendChild(btn);
      });

      afficherPlats();
      mettreAJourTicket();
    }

    function afficherPlats() {
      const container = document.getElementById('dishes-content');
      container.innerHTML = '';
      const platsFiltres = menuData.filter(d => d.cat === currentTab);
      const sections = [...new Set(platsFiltres.map(d => d.section))];

      sections.forEach(secTitle => {
        const secHeader = document.createElement('div');
        secHeader.className = 'section-header';
        secHeader.innerText = secTitle;
        container.appendChild(secHeader);

        const grid = document.createElement('div');
        grid.className = 'items-grid';

        const platsDeLaSection = platsFiltres.filter(d => d.section === secTitle);
        platsDeLaSection.forEach(plat => {
          const qte = cart[plat.id] || 0;
          const card = document.createElement('div');
          card.className = `dish-card ${qte > 0 ? 'active' : ''}`;
          card.id = `card-${plat.id}`;
          card.innerHTML = `
            <div class="dish-info">
              <div class="dish-name">${plat.nom}</div>
              <div class="dish-price">${plat.prix > 0 ? plat.prix.toFixed(2) + ' €' : 'Inclus'}</div>
            </div>
            <div class="qty-controls">
              <button class="btn-q" onclick="modifierQuantite('${plat.id}', -1)">-</button>
              <span class="q-val" id="qty-${plat.id}">${qte}</span>
              <button class="btn-q plus" onclick="modifierQuantite('${plat.id}', 1)">+</button>
            </div>
          `;
          grid.appendChild(card);
        });
        container.appendChild(grid);
      });
    }

    function modifierQuantite(id, delta) {
      const next = (cart[id] || 0) + delta;
      if (next <= 0) delete cart[id];
      else cart[id] = next;

      const el = document.getElementById(`qty-${id}`);
      const card = document.getElementById(`card-${id}`);
      if (el) el.innerText = cart[id] || 0;
      if (card) {
        if (cart[id] > 0) card.classList.add('active');
        else card.classList.remove('active');
      }
      mettreAJourTicket();
    }

    function mettreAJourTicket() {
      const container = document.getElementById('ticket-container');
      const countEl = document.getElementById('ticket-items-count');
      const totalEl = document.getElementById('ticket-total-val');
      const btnSend = document.getElementById('btn-submit');

      const itemIds = Object.keys(cart);
      if (itemIds.length === 0) {
        container.innerHTML = '<div class="ticket-empty">Aucun article sélectionné</div>';
        countEl.innerText = '0 article';
        totalEl.innerText = '0,00 €';
        btnSend.disabled = true;
        return;
      }

      container.innerHTML = '';
      let total = 0;
      let totalQte = 0;

      itemIds.forEach(id => {
        const plat = menuData.find(d => d.id === id);
        if (!plat) return;

        const qte = cart[id];
        const ligneTotal = plat.prix * qte;
        total += ligneTotal;
        totalQte += qte;

        const row = document.createElement('div');
        row.className = 'ticket-row';
        row.innerHTML = `
          <div class="ticket-row-info">
            <div class="ticket-row-title">${plat.nom}</div>
            <div class="ticket-row-cat">${plat.cat}</div>
          </div>
          <div class="ticket-row-price">${ligneTotal > 0 ? ligneTotal.toFixed(2) + ' €' : 'Inclus'}</div>
          <div class="qty-controls">
            <button class="btn-q" onclick="modifierQuantite('${plat.id}', -1)">-</button>
            <span class="q-val">${qte}</span>
            <button class="btn-q plus" onclick="modifierQuantite('${plat.id}', 1)">+</button>
          </div>
        `;
        container.appendChild(row);
      });

      countEl.innerText = `${totalQte} article${totalQte > 1 ? 's' : ''}`;
      totalEl.innerText = `${total.toFixed(2)} €`;
      btnSend.disabled = false;
    }

    async function envoyerCommande() {
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'Envoi...';

      const items = Object.keys(cart).map(id => {
        const plat = menuData.find(d => d.id === id);
        return {
          article_nom: plat.nom,
          prix: plat.prix,
          quantite: cart[id],
          remarques: ''
        };
      });

      const payload = {
        table_num: currentTable,
        items: items,
        remarques: document.getElementById('order-notes').value.trim()
      };

      try {
        await fetch('/api/commandes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (socket) socket.emit('nouvelle_commande', payload);

        alert(`✅ Commande de la Table ${currentTable} envoyée en cuisine !`);
        cart = {};
        document.getElementById('order-notes').value = '';
        afficherPlats();
        mettreAJourTicket();
      } catch (err) {
        alert("Erreur envoi");
        btn.disabled = false;
        btn.innerText = 'Envoyer en cuisine';
      }
    }

    // Gestion de la notification "Prêt à servir"
    if (socket) {
      socket.on('statut_mis_a_jour', (data) => {
        if (data && data.statut === 'pret') {
          const bar = document.getElementById('notif-ready-bar');
          const txt = document.getElementById('notif-ready-text');
          txt.innerText = `Table ${data.table_num || ''} est PRÊTE à être servie !`;
          bar.style.display = 'block';
        }
      });
    }

    function masquerNotifReady() {
      document.getElementById('notif-ready-bar').style.display = 'none';
    }

    init();
  </script>
</body>
</html>
