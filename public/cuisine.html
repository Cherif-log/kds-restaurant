<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Écran Cuisine</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #1e1e24;
      color: #fff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #333;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-audio {
      background: #3a3a4c;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-audio.actif {
      background: #28a745;
      border-color: #28a745;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .ticket {
      background: #2b2b36;
      border: 2px solid #444;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
      transition: border-color 0.3s ease;
    }
    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .ticket-table { font-weight: 700; font-size: 18px; color: #ffcc00; }
    
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .chrono {
      font-weight: 700;
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .chrono-ok { background: #1e4620; color: #4ade80; }
    .chrono-warn { background: #543b0c; color: #fbbf24; }
    .chrono-danger { 
      background: #5c1d1d; 
      color: #f87171; 
      animation: clignotement 1s infinite alternate;
    }

    @keyframes clignotement {
      from { opacity: 1; }
      to { opacity: 0.5; }
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-attente { background: #ff9800; color: #000; }
    .badge-prepa { background: #007aff; color: #fff; }
    .badge-prete { background: #28a745; color: #fff; }
    
    .ticket-content { font-size: 15px; line-height: 1.4; white-space: pre-wrap; flex: 1; margin-bottom: 12px; }
    .btn-action {
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }
    .btn-prepa { background: #007aff; }
    .btn-prete { background: #28a745; }
    .btn-servie { background: #6c757d; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <header>
    <h1>Commandes en Cuisine</h1>
    <div class="header-actions">
      <button id="btnSon" class="btn-audio" onclick="activerSon()">Activer le son</button>
      <span id="compteur">0 commande(s)</span>
    </div>
  </header>

  <div class="grid" id="grilleCommandes"></div>

  <script>
    const socket = io();
    const grille = document.getElementById('grilleCommandes');
    const compteur = document.getElementById('compteur');
    const btnSon = document.getElementById('btnSon');
    
    let audioCtx = null;
    let nombreCommandesPrecedent = 0;
    let commandesEnCours = [];

    function activerSon() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      btnSon.innerText = 'Son activé';
      btnSon.classList.add('actif');
    }

    function emettreBip() {
      if (!audioCtx || audioCtx.state !== 'running') return;

      const buzzer = (frequence, debut, duree) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(frequence, audioCtx.currentTime + debut);
        gain.gain.setValueAtTime(1.0, audioCtx.currentTime + debut);
        gain.gain.setValueAtTime(1.0, audioCtx.currentTime + debut + duree - 0.02);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + debut + duree);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + debut);
        osc.stop(audioCtx.currentTime + debut + duree);
      };

      buzzer(2600, 0.00, 0.25);
      buzzer(2600, 0.35, 0.25);
      buzzer(2600, 0.70, 0.25);
      buzzer(2600, 1.05, 0.25);
      buzzer(3200, 1.40, 0.60);
    }

    function calculerTemps(timestampMs) {
      const ecartSec = Math.max(0, Math.floor((Date.now() - timestampMs) / 1000));
      const minutes = Math.floor(ecartSec / 60);
      const secondes = ecartSec % 60;
      const texte = `${minutes}m ${secondes < 10 ? '0' : ''}${secondes}s`;

      let classe = 'chrono-ok';
      if (minutes >= 15) {
        classe = 'chrono-danger';
      } else if (minutes >= 7) {
        classe = 'chrono-warn';
      }
      return { texte, classe };
    }

    function boutonAction(cmd) {
      if (cmd.statut === 'En attente') {
        return `<button class="btn-action btn-prepa" onclick="changerStatut('${cmd.id}', 'En préparation')">Lancer la préparation</button>`;
      }
      if (cmd.statut === 'En préparation') {
        return `<button class="btn-action btn-prete" onclick="changerStatut('${cmd.id}', 'Prête')">Marquer comme Prête</button>`;
      }
      if (cmd.statut === 'Prête') {
        return `<button class="btn-action btn-servie" onclick="changerStatut('${cmd.id}', 'Servie')">Archiver / Servie</button>`;
      }
    }

    function badgeStatut(statut) {
      if (statut === 'En attente') return '<span class="badge badge-attente">En attente</span>';
      if (statut === 'En préparation') return '<span class="badge badge-prepa">En préparation</span>';
      if (statut === 'Prête') return '<span class="badge badge-prete">Prête</span>';
      return '';
    }

    function afficherCommandes(commandes) {
      commandesEnCours = commandes;
      compteur.innerText = `${commandes.length} commande(s) active(s)`;

      if (commandes.length > nombreCommandesPrecedent) {
        emettreBip();
      }
      nombreCommandesPrecedent = commandes.length;

      if (commandes.length === 0) {
        grille.innerHTML = '<p style="color: #888;">Aucune commande en cours.</p>';
        return;
      }

      grille.innerHTML = commandes.map(cmd => {
        const chrono = calculerTemps(parseInt(cmd.id, 10));
        return `
          <div class="ticket" id="ticket-${cmd.id}">
            <div>
              <div class="ticket-header">
                <span class="ticket-table">${cmd.table}</span>
                <span class="chrono ${chrono.classe}" id="chrono-${cmd.id}">${chrono.texte}</span>
              </div>
              <div class="meta-bar">
                ${badgeStatut(cmd.statut)}
                <span style="font-size: 12px; color: #888;">${cmd.heure}</span>
              </div>
              <div class="ticket-content">${cmd.details}</div>
            </div>
            ${boutonAction(cmd)}
          </div>
        `;
      }).join('');
    }

    // Mise à jour continue des chronomètres chaque seconde
    setInterval(() => {
      commandesEnCours.forEach(cmd => {
        const chronoEl = document.getElementById(`chrono-${cmd.id}`);
        if (chronoEl) {
          const chrono = calculerTemps(parseInt(cmd.id, 10));
          chronoEl.innerText = chrono.texte;
          chronoEl.className = `chrono ${chrono.classe}`;
        }
      });
    }, 1000);

    async function changerStatut(id, statut) {
      await fetch(`/api/commandes/${id}/statut`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ statut })
      });
    }

    async function chargerCommandes() {
      const res = await fetch('/api/commandes');
      const data = await res.json();
      nombreCommandesPrecedent = data.length;
      afficherCommandes(data);
    }

    socket.on('miseAJourCommandes', (commandes) => afficherCommandes(commandes));
    chargerCommandes();
  </script>
</body>
</html>
