<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écran Cuisine — KDS</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: #1e293b; border-bottom: 2px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    
    .header-btns { display: flex; gap: 10px; align-items: center; }
    .btn-header { background: #334155; color: #fff; border: 1px solid #475569; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-header:hover { background: #475569; }
    .btn-stock { background: #b91c1c; border-color: #ef4444; }
    .btn-stock:hover { background: #991b1b; }

    .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; padding: 20px; flex: 1; overflow-y: auto; }

    .kds-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .kds-card.en_preparation { border-color: var(--warning); }
    .kds-card.pret { border-color: var(--success); }
    .kds-card.urgent { border-color: var(--danger); animation: pulse-card 1.5s infinite; }
    @keyframes pulse-card { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

    .kds-card-head { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
    .kds-table-title { font-size: 1.2rem; font-weight: 800; }
    .kds-timer { font-size: 0.85rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
    .timer-green { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .timer-yellow { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .timer-red { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .kds-card-subhead { padding: 6px 16px; font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); }

    .kds-items-list { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .kds-item-row { display: flex; flex-direction: column; font-size: 0.95rem; }
    .kds-item-main { display: flex; justify-content: space-between; font-weight: 700; }
    .kds-item-remark { font-size: 0.8rem; font-weight: 800; color: #f87171; margin-top: 2px; }

    .kds-order-remark { background: #3b2020; border: 1px dashed #ef4444; color: #fca5a5; padding: 8px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; margin: 10px 16px; }

    .kds-card-actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .btn-action-kds { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-prep { background: var(--warning); color: #000; }
    .btn-pret { background: var(--success); color: #fff; }
    .btn-servi { background: #334155; color: #fff; }

    /* MODAL RUPTURE DE STOCK */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 999; align-items: center; justify-content: center; padding: 15px; }
    .modal-card { background: #1e293b; width: 100%; max-width: 500px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    .modal-head { background: #0f172a; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
    .modal-body { padding: 18px; max-height: 75vh; overflow-y: auto; }
    
    .stock-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .stock-item-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; }
    .stock-item-row.epuise { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    .btn-toggle-stock { padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 0.78rem; cursor: pointer; border: none; }
    .btn-toggle-stock.dispo { background: var(--success); color: #fff; }
    .btn-toggle-stock.out { background: var(--danger); color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1 id="kds-title">👨‍🍳 Écran Cuisine & Bar</h1>
    <div class="header-btns">
      <button class="btn-header btn-stock" onclick="ouvrirModalStock()">🚫 Ruptures (86-List)</button>
      <a href="/index.html" class="btn-header">📱 Salle & Caisse</a>
      <a href="/admin.html" class="btn-header">📊 Admin</a>
    </div>
  </header>

  <main class="kds-grid" id="kds-container">
    <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px; font-size: 1.1rem;">
      Aucun bon de commande en attente. Tout est calme en cuisine ! 🌴
    </div>
  </main>

  <!-- MODAL GESTION DU STOCK EN CUISINE -->
  <div class="modal-overlay" id="stock-modal">
    <div class="modal-card">
      <div class="modal-head">
        <span>🚫 Déclarer une rupture de stock en direct</span>
        <button style="background:none; border:none; color:#fff; font-size:1.3rem; cursor:pointer;" onclick="fermerModalStock()">✕</button>
      </div>
      <div class="modal-body">
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:12px;">
          Un article marqué épuisé sera grisé en temps réel sur tous les smartphones des serveurs :
        </p>
        <div class="stock-grid" id="stock-items-container">
          <div style="text-align:center; padding:15px; color:var(--text-muted);">Chargement de la carte...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = typeof io !== 'undefined' ? io() : null;
    let orders = [];
    let menuItems = [];
    let indisponibles = [];

    function parseSqliteDate(dateStr) {
      if (!dateStr) return new Date();
      if (dateStr.includes('T')) return new Date(dateStr);
      return new Date(dateStr.replace(' ', 'T') + 'Z');
    }

    async function chargerThemeKds() {
      try {
        const res = await fetch('/api/config/client');
        if (res.ok) {
          const cfg = await res.json();
          document.title = `${cfg.etablissement} — Écran Cuisine`;
          const titleEl = document.getElementById('kds-title');
          if (titleEl) titleEl.innerText = `👨‍🍳 ${cfg.etablissement} — Écran Cuisine`;
        }
      } catch (e) {}
    }

    async function chargerCommandes() {
      try {
        const res = await fetch('/api/commandes');
        if (res.ok) {
          orders = await res.json();
          renderKds();
        }
      } catch (e) {}
    }

    function renderKds() {
      const container = document.getElementById('kds-container');
      if (!container) return;

      const activeOrders = orders.filter(o => o.statut !== 'servi' && o.statut !== 'encaisse' && o.statut !== 'annule');

      if (activeOrders.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 50px; font-size: 1.1rem;">
            Aucun bon de commande en attente. Tout est calme en cuisine ! 🌴
          </div>
        `;
        return;
      }

      const now = new Date();
      container.innerHTML = activeOrders.map(o => {
        const d = parseSqliteDate(o.date_creation);
        const minutes = Math.max(0, Math.floor((now - d) / 60000));
        
        let timerClass = 'timer-green';
        let isUrgent = false;
        if (minutes >= 20) {
          timerClass = 'timer-red';
          isUrgent = true;
        } else if (minutes >= 10) {
          timerClass = 'timer-yellow';
        }

        const heure = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

        let actionBtn = '';
        if (o.statut === 'en_attente') {
          actionBtn = `<button class="btn-action-kds btn-prep" onclick="changerStatutCommande(${o.id}, 'en_preparation')">▶ En préparation</button>`;
        } else if (o.statut === 'en_preparation' || o.statut === 'en_cours') {
          actionBtn = `<button class="btn-action-kds btn-pret" onclick="changerStatutCommande(${o.id}, 'pret')">✔ Prêt à servir</button>`;
        } else if (o.statut === 'pret') {
          actionBtn = `<button class="btn-action-kds btn-servi" onclick="changerStatutCommande(${o.id}, 'servi')">🚀 Envoyé en salle</button>`;
        }

        const itemsHtml = (o.items || []).map(it => `
          <div class="kds-item-row">
            <div class="kds-item-main">
              <span><strong>${it.quantite}x</strong> ${it.article_nom}</span>
            </div>
            ${it.remarques ? `<div class="kds-item-remark">👉 ${it.remarques}</div>` : ''}
          </div>
        `).join('');

        return `
          <div class="kds-card ${o.statut} ${isUrgent ? 'urgent' : ''}">
            <div class="kds-card-head">
              <span class="kds-table-title">Table ${o.table_num}</span>
              <span class="kds-timer ${timerClass}">⏱️ ${minutes} min</span>
            </div>
            <div class="kds-card-subhead">
              <span>Reçu à ${heure}</span>
              <span>👤 ${o.serveur_nom || 'Salle'}</span>
            </div>
            <div class="kds-items-list">
              ${itemsHtml}
            </div>
            ${o.remarques ? `<div class="kds-order-remark">⚠️ Note : ${o.remarques}</div>` : ''}
            <div class="kds-card-actions">
              ${actionBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    async function changerStatutCommande(id, statut) {
      try {
        const res = await fetch(`/api/commandes/${id}/statut`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ statut })
        });
        if (res.ok) {
          chargerCommandes();
        }
      } catch (e) {}
    }

    async function chargerStock() {
      try {
        const [resMenu, resStock] = await Promise.all([
          fetch('/api/menu'),
          fetch('/api/stock/indisponibles')
        ]);
        if (resMenu.ok) menuItems = await resMenu.json();
        if (resStock.ok) indisponibles = await resStock.json();
        renderStockModal();
      } catch (e) {}
    }

    function renderStockModal() {
      const container = document.getElementById('stock-items-container');
      if (!container || menuItems.length === 0) return;

      container.innerHTML = menuItems.map(item => {
        const isOut = indisponibles.includes(item.slug);
        return `
          <div class="stock-item-row ${isOut ? 'epuise' : ''}">
            <span>${item.nom}</span>
            <button class="btn-toggle-stock ${isOut ? 'out' : 'dispo'}" onclick="toggleRupture('${item.slug}', '${item.nom.replace(/'/g, "\\'")}')">
              ${isOut ? '🔴 Épuisé' : '🟢 Disponible'}
            </button>
          </div>
        `;
      }).join('');
    }

    async function toggleRupture(slug, nom) {
      try {
        const res = await fetch('/api/stock/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ article_id: slug, article_nom: nom })
        });
        if (res.ok) {
          const data = await res.json();
          indisponibles = data.indisponibles;
          renderStockModal();
        }
      } catch (e) {}
    }

    function ouvrirModalStock() {
      chargerStock();
      document.getElementById('stock-modal').style.display = 'flex';
    }

    function fermerModalStock() {
      document.getElementById('stock-modal').style.display = 'none';
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    if (socket) {
      socket.on('nouvelle_commande', () => {
        playBeep();
        chargerCommandes();
      });
      socket.on('statut_mis_a_jour', () => chargerCommandes());
      socket.on('table_status_change', () => chargerCommandes());
      socket.on('reclamer_suite', (data) => {
        playBeep();
        alert(`🔔 SUITE RÉCLAMÉE : Table ${data.table_num} demande la suite (${data.course}) !`);
      });
      socket.on('stock_update', (data) => {
        indisponibles = data;
        renderStockModal();
      });
    }

    chargerThemeKds();
    chargerCommandes();
    setInterval(renderKds, 30000);
  </script>
</body>
</html>
