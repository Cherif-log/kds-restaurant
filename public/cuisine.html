<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hôtel des Pins — Écran Cuisine</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --attente: #eab308;
      --prepa: #f97316;
      --pret: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; }

    /* Bannière de déverrouillage audio au chargement */
    #audio-banner { display: none; background: #dc2626; color: #fff; text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: 700; cursor: pointer; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.85; } 50% { opacity: 1; } 100% { opacity: 0.85; } }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 2px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    
    .header-controls { display: flex; align-items: center; gap: 12px; }
    .badge-audio { background: #16a34a; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
    .badge-status { background: #22c55e; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }

    .tickets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
    .empty-state { grid-column: 1 / -1; text-align: center; color: var(--text-muted); font-size: 1.1rem; padding: 80px 20px; }

    .ticket-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 8px 20px rgba(0,0,0,0.3); animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    .ticket-top { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 800; }
    .ticket-table { font-size: 1.25rem; }
    .ticket-time { font-size: 0.85rem; color: var(--text-muted); }

    .status-en_attente .ticket-top { background: rgba(234, 179, 8, 0.15); border-bottom: 2px solid var(--attente); }
    .status-en_attente .badge-stat { background: var(--attente); color: #000; }

    .status-en_cours .ticket-top, .status-en_preparation .ticket-top { background: rgba(249, 115, 22, 0.15); border-bottom: 2px solid var(--prepa); }
    .status-en_cours .badge-stat, .status-en_preparation .badge-stat { background: var(--prepa); color: #fff; }

    .status-pret .ticket-top { background: rgba(34, 197, 94, 0.15); border-bottom: 2px solid var(--pret); }
    .status-pret .badge-stat { background: var(--pret); color: #fff; }

    .badge-stat { padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }

    .ticket-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .ticket-item { display: flex; justify-content: space-between; font-weight: 700; font-size: 1rem; border-bottom: 1px dashed var(--border); padding-bottom: 6px; }
    .item-qty { color: var(--accent); margin-right: 6px; font-weight: 800; }
    .ticket-remarque { background: #334155; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; color: #fde047; font-weight: 600; margin-top: 6px; }

    .ticket-actions { padding: 12px 16px; background: rgba(0,0,0,0.15); border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .btn-action { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .btn-start { background: var(--prepa); color: #fff; }
    .btn-ready { background: var(--pret); color: #fff; }
    .btn-done { background: #475569; color: #fff; }
  </style>
</head>
<body onclick="debloquerAudioAutomatique()">

  <div id="audio-banner" onclick="debloquerAudioAutomatique()">
    🔔 Alarme en attente : cliquez ici pour autoriser la sonnerie automatique du KDS
  </div>

  <header>
    <h1>👨‍🍳 KDS Cuisine — Hôtel des Pins</h1>
    <div class="header-controls">
      <span class="badge-audio" id="badge-audio">🔊 Alarme prête</span>
      <span id="active-count" style="font-weight:700; font-size:0.9rem;">0 en cours</span>
      <span class="badge-status" id="socket-status">En direct</span>
    </div>
  </header>

  <div class="tickets-grid" id="tickets-container">
    <div class="empty-state">En attente de commandes...</div>
  </div>

  <script>
    const socket = typeof io !== 'undefined' ? io() : null;
    let commandes = [];
    let audioCtx = null;

    // Initialisation du contexte audio
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Déverrouillage automatique dès le premier contact avec l'écran
    function debloquerAudioAutomatique() {
      initAudioContext();
      if (audioCtx && audioCtx.state === 'running') {
        document.getElementById('audio-banner').style.display = 'none';
        document.getElementById('badge-audio').innerText = '🔊 Alarme active';
      }
    }

    // ALARME FORTE, TRÈS AIGUË & STRIDENTE (5 SECONDES)
    function jouerAlarme5s() {
      try {
        initAudioContext();
        if (!audioCtx || audioCtx.state !== 'running') {
          document.getElementById('audio-banner').style.display = 'block';
          return;
        }

        const now = audioCtx.currentTime;
        const duration = 5.0; // 5 secondes

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // Onde "square" (carrée) : timbre strident perçant le bruit
        osc.type = 'square';

        // Alternance de fréquences aiguës (2 200 Hz et 1 600 Hz)
        for (let t = 0; t < duration; t += 0.25) {
          osc.frequency.setValueAtTime(2200, now + t);
          osc.frequency.setValueAtTime(1600, now + t + 0.12);
        }

        // Bips rapides et puissants au volume maximum (gain = 1.0)
        for (let t = 0; t < duration; t += 0.25) {
          gain.gain.setValueAtTime(1.0, now + t);
          gain.gain.setValueAtTime(0.01, now + t + 0.20);
        }
        gain.gain.setValueAtTime(0, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch (err) {
        console.warn('Erreur audio :', err);
      }
    }

    // Chargement API
    async function chargerCommandes() {
      try {
        const res = await fetch('/api/commandes');
        if (res.ok) {
          const data = await res.json();
          commandes = data.filter(c => c.statut !== 'servi' && c.statut !== 'annule');
          afficherTickets();
        }
      } catch (e) {
        console.error(e);
      }
    }

    // Réception Socket.io
    if (socket) {
      socket.on('nouvelle_commande', () => {
        jouerAlarme5s();
        chargerCommandes();
      });

      socket.on('statut_mis_a_jour', () => {
        chargerCommandes();
      });
    }

    function afficherTickets() {
      const container = document.getElementById('tickets-container');
      const countEl = document.getElementById('active-count');
      
      countEl.innerText = `${commandes.length} commande${commandes.length > 1 ? 's' : ''}`;

      if (commandes.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucune commande en attente 🎉</div>';
        return;
      }

      container.innerHTML = '';

      commandes.forEach(cmd => {
        const div = document.createElement('div');
        div.className = `ticket-card status-${cmd.statut || 'en_attente'}`;

        const heure = cmd.date_creation ? new Date(cmd.date_creation).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

        let itemsHtml = '';
        if (cmd.items && Array.isArray(cmd.items)) {
          itemsHtml = cmd.items.map(it => `
            <div class="ticket-item">
              <span><span class="item-qty">${it.quantite || 1}x</span> ${it.article_nom || it.nom}</span>
            </div>
          `).join('');
        }

        let actionsHtml = '';
        if (cmd.statut === 'en_attente' || !cmd.statut) {
          actionsHtml = `<button class="btn-action btn-start" onclick="changerStatut(${cmd.id}, 'en_cours')">▶ Lancer Prépa</button>`;
        } else if (cmd.statut === 'en_cours' || cmd.statut === 'en_preparation') {
          actionsHtml = `<button class="btn-action btn-ready" onclick="changerStatut(${cmd.id}, 'pret')">✔ Prêt à Servir</button>`;
        } else if (cmd.statut === 'pret') {
          actionsHtml = `<button class="btn-action btn-done" onclick="changerStatut(${cmd.id}, 'servi')">✓ Servi / Archiver</button>`;
        }

        div.innerHTML = `
          <div class="ticket-top">
            <span class="ticket-table">Table ${cmd.table_num}</span>
            <span class="badge-stat">${getLibelleStatut(cmd.statut)}</span>
            <span class="ticket-time">${heure}</span>
          </div>
          <div class="ticket-body">
            ${itemsHtml}
            ${cmd.remarques ? `<div class="ticket-remarque">Note : ${cmd.remarques}</div>` : ''}
          </div>
          <div class="ticket-actions">
            ${actionsHtml}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function getLibelleStatut(st) {
      if (st === 'en_cours' || st === 'en_preparation') return 'En Prépa';
      if (st === 'pret') return 'Prêt';
      return 'En Attente';
    }

    async function changerStatut(id, statut) {
      try {
        await fetch(`/api/commandes/${id}/statut`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ statut })
        });
        if (socket) socket.emit('changer_statut', { id, statut });
        chargerCommandes();
      } catch (e) {}
    }

    // Vérification du statut audio au chargement
    window.addEventListener('load', () => {
      initAudioContext();
      if (!audioCtx || audioCtx.state !== 'running') {
        document.getElementById('audio-banner').style.display = 'block';
      }
    });

    setInterval(chargerCommandes, 5000);
    chargerCommandes();
  </script>
</body>
</html>
